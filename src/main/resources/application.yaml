server:
  port: ${SERVER_PORT}

spring:
  application:
    name: product-service

  datasource:

    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT}/${DB_NAME}?sslmode=disable

    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

