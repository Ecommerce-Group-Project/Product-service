name: Deploy Service to AKS

on:
  push:
    branches:
      - main
      - Feature/Deployment
    paths:
      - .github/workflows/deploy.yaml
      - src/**
      - k8s/deployment.yaml
      - Dockerfile
      - pom.xml


env:
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  ACR_REGISTRY_NAME: ${{ vars.ACR_REGISTRY_NAME }}
  ACR_DOMAIN_NAME: ${{ vars.ACR_REGISTRY_NAME }}.azurecr.io
  REPOSITORY_NAME: ${{ vars.REPOSITORY_NAME }}
  


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_REGISTRY_NAME }}

      - name: Build and push image
        id: build-image
        run: |
          IMAGE_URI=${{ env.ACR_DOMAIN_NAME }}/${{ env.REPOSITORY_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Update Kubernetes deployment manifest with new image
        run: |
          IMAGE_URI=${{ steps.build-image.outputs.image }}
          yq e '.spec.template.spec.containers[0].image = "'"$IMAGE_URI"'"' -i k8s/deployment.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add k8s/deployment.yaml
          
          git commit -m "ci: update image tag to ${{ github.sha }}"
          
          git push