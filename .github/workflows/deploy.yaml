name: Deploy Service to AKS

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - Dockerfile
      - pom.xml
      - .github/workflows/deploy.yaml

env:
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  ACR_REGISTRY_NAME: ${{ vars.ACR_REGISTRY_NAME }}
  ACR_DOMAIN_NAME: ${{ vars.ACR_REGISTRY_NAME }}.azurecr.io
  REPOSITORY_NAME: ${{ vars.REPOSITORY_NAME }}

  INFRA_REPO: 'Ecommerce-Group-Project/git-ops'
  MANIFEST_PATH: 'k8s/product_service/deployment.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1. Checkout the App Code repository to build the jar and Docker image
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_REGISTRY_NAME }}

      # Build and push using the hash tag
      - name: Build and push image
        id: build-image
        run: |
          IMAGE_URI=${{ env.ACR_DOMAIN_NAME }}/${{ env.REPOSITORY_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      # 2. Checkout your GitOps repository into a temporary folder
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: 'gitops-repo'

      # 3. Dynamically update the manifest inside the checked-out folder
      - name: Update Kubernetes deployment manifest in GitOps Repo
        run: |
          IMAGE_URI=${{ steps.build-image.outputs.image }}
          yq e '.spec.template.spec.containers[0].image = "'"$IMAGE_URI"'"' -i gitops-repo/${{ env.MANIFEST_PATH }}

      # 4. Move into the GitOps directory, stage changes, commit, and push
      - name: Commit and push changes to GitOps Repo
        run: |
          cd gitops-repo
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add ${{ env.MANIFEST_PATH }}
          git commit -m "ci: update product-service image tag to ${{ github.sha }}"
          
          git push origin main