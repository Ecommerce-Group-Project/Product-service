name: Publish

on:
  push:
    branches:
      - main
      - Feature/Deployment
    paths:
      - src/**
      - pom.xml
      - .github/workflows/publish.yaml

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Java
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Cache Sonar packages
      - name: Cache Sonar Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

        # Build the project
      - name: Build with Maven
        run:  mvn -B clean verify

      # Run tests + build + sonar
      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
         mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=Ecommerce-Group-Project_Product-service \
          -Dsonar.organization=Ecommerce-Group-Project

      # Upload built jar
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-service
          path: target/product-service.jar

  publish:
    name: Publish to argocd
    needs: build
    runs-on: ubuntu-latest
    environment: production

    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      ACR_REGISTRY_NAME: ${{ vars.ACR_REGISTRY_NAME }}
      ACR_DOMAIN_NAME: ${{ vars.ACR_REGISTRY_NAME }}.azurecr.io
      REPOSITORY_NAME: ${{ vars.REPOSITORY_NAME }}

      INFRA_REPO: 'Ecommerce-Group-Project/git-ops'
      MANIFEST_PATH: 'k8s/product_service/deployment.yaml'

    steps:

      # Check out source code
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Download JAR produced by build job
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: product-service
          path: target

      # Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Login to Azure Container Registry
      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_REGISTRY_NAME }}

      # Build and Push Docker Image
      - name: Build and Push Image
        id: build-image
        run: |
          IMAGE_URI=${{ env.ACR_DOMAIN_NAME }}/${{ env.REPOSITORY_NAME }}:${{ github.sha }}
  
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
  
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      # Checkout GitOps repository
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops-repo

      # Update deployment manifest
      - name: Update Kubernetes Deployment Manifest
        run: |
          IMAGE_URI=${{ steps.build-image.outputs.image }}
  
          yq e '.spec.template.spec.containers[0].image = "'"$IMAGE_URI"'"' \
            -i gitops-repo/${{ env.MANIFEST_PATH }}

      # Commit & Push changes
      - name: Commit and Push Changes
        run: |
          cd gitops-repo
  
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
  
          git add ${{ env.MANIFEST_PATH }}
  
          git diff --cached --quiet || \
          git commit -m "ci: update product-service image tag to ${{ github.sha }}"
  
          git push origin main